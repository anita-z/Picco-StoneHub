# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Load GitHub Secrets into Environment Variables
      - name: Set Environment Variables
        run: |
          echo "APS_CLIENT_ID=${{ secrets.APS_CLIENT_ID }}" >> $GITHUB_ENV
          echo "APS_CLIENT_SECRET=${{ secrets.APS_CLIENT_SECRET }}" >> $GITHUB_ENV
          echo "SERVER_SESSION_SECRET=${{ secrets.SERVER_SESSION_SECRET }}" >> $GITHUB_ENV

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PICCO_STONEHUB_CONNECT }}
          channelId: live
          projectId: picco-stonehub-connect
          entryPoint: stone-hub
